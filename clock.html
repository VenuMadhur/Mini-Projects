<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clock</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen flex items-center justify-center bg-slate-950 px-4">
    <div class="w-full max-w-xl rounded-3xl border border-slate-700 bg-gradient-to-br from-slate-900 to-slate-800 p-8 text-center shadow-2xl">

        <p class="text-sm font-medium uppercase tracking-[0.3em] text-slate-400">Digital Clock</p>

        <h1 id="clock" class="mt-6 text-6xl font-mono tracking-wider text-white sm:text-7xl"></h1>
        <p id ="date" class="mt-4 text-base font-medium text-slate-400"></p>

        <div class="mt-6 flex items-center justify-center gap-2">
            <span class="h-2 w-2 rounded-full bg-emerald-400"></span><p class="text-sm text-slate-400">Live • Local Time</p>
        </div>

    </div>
    <script src="clock.js"></script>
</body>
</html>
