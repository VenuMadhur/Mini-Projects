<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stop-Watch</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-950 px-4 flex items-center justify-center">

    <div class="w-full max-w-xl rounded-3xl border border-slate-700 bg-slate-900 p-10 text-center shadow-2xl">

        <p class="text-sm font-medium uppercase tracking-[0.3em] text-slate-400">
            Stopwatch
        </p>

        <h1 id="stopwatch" class="mt-6 whitespace-nowrap font-mono text-5xl font-bold tracking-wider text-white sm:text-7xl">
            00 : 00 : 00
        </h1>

        <p class="mt-4 text-sm text-slate-400">Track your time with precision</p>

        <div class="mt-8 flex flex-wrap justify-center gap-3">
            <button id="start" class="rounded-xl bg-emerald-500 px-6 py-3 font-semibold text-white transition hover:bg-emerald-600">
                Start
            </button>

            <button id="stop" class="rounded-xl bg-red-500 px-6 py-3 font-semibold text-white transition hover:bg-red-600">
                Stop
            </button>

            <button id="reset" class="rounded-xl bg-slate-700 px-6 py-3 font-semibold text-white transition hover:bg-slate-600">
                Reset
            </button>

        </div>

    </div>

    <script src="stopwatch.js"></script>
</body>
</html>
